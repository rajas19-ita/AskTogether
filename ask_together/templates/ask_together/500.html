{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<main>
    <div class="layout justify-content-center">
        <section class="error__card">
            <h1 class="error__title">500</h1>
            <p class="error__message">Something went wrong on our side.</p>
            <p class="error__message error__message--sm">
                Please try again in a few minutes.
            </p>
            <a href="{% url 'ask_together:home' %}" class="at-btn at-btn-brand mt-3">
                Go Home
            </a>
        </section>
    </div>
</main>
{% endblock %}
