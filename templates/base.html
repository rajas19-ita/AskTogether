{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" type="image/png" href="{% static 'ask_together/img/logo_b.png' %}" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
        
    
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="{% static 'ask_together/css/main.css' %}"/>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
        
        {% block css_block %}{% endblock %}

        <title>{% block title %}AskTogether{% endblock %}</title>
    </head>
    <body>
        {% block content %}
        {% endblock %}
        <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script>
            function formatUTCtoLocal(root=document, selector = ".datetime") {
                root.querySelectorAll(selector).forEach(el => {
                    const dt = new Date(el.dataset.dt);
                    el.textContent = dt.toLocaleString("en-US", {
                        year: "numeric",
                        month: "short",
                        day: "numeric",
                        hour: "numeric",
                        minute: "2-digit",
                        hour12: true
                    });
                });
            }

            function timeAgo(dateString) {
                const now = new Date();
                const past = new Date(dateString);

                const seconds = Math.floor((now - past) / 1000);

                const intervals = [
                    { label: 'year', seconds: 31536000 },
                    { label: 'month', seconds: 2592000 },
                    { label: 'day', seconds: 86400 },
                    { label: 'hour', seconds: 3600 },
                    { label: 'minute', seconds: 60 },
                    { label: 'second', seconds: 1 }
                ];

                for (const interval of intervals) {
                    const count = Math.floor(seconds / interval.seconds);
                    if (count > 0) {
                        return `${count} ${interval.label}${count > 1 ? 's' : ''} ago`;
                    }
                }
                return 'just now';
            }

            const saveQuestion = (button, id)=>{
                const wasSaved = button.dataset.saved === "true"
                const url = `{% url 'ask_together:save_question' 0 %}`.replace('0',`${id}`)
                const method = wasSaved ? "DELETE":"POST"

                button.dataset.saved = (!wasSaved).toString()
                button.disabled=true
                var notyf = new Notyf({
                    position: {
                        x:'center',
                        y:'top'
                    }
                })

                fetch(url,{
                        method,
                        headers:{
                            'X-CSRFToken': "{{csrf_token}}"  
                        }
                    })
                    .then(res =>{
                        if(res.ok){
                            return res.json()
                        }else{
                            return res.json().then((err)=> {throw err})
                        }
                    })
                    .then(data => {
                        button.dataset.saved = data.saved.toString()
           
                        notyf.success(data.saved===true?"Question Saved":"Question Unsaved")
                    })
                    .catch(err => {
                        button.dataset.saved = wasSaved.toString()

                        notyf.error("Some error occurred")
                    })
                    .finally(() => {
                        button.disabled = false
                    })
                
            }

        </script>

        <script>
        
            const sidebar = document.querySelector('.at-sidebar');
            const overlay = document.querySelector('.at-sidebar-overlay');

            sidebar?.addEventListener('click', (e) => {
                if (e.target.closest('a')) {
                    sidebar?.classList.remove('open');
                    overlay?.classList.remove('active');
                }
            })
            
            overlay?.addEventListener('click', () => {
                sidebar?.classList.remove('open');
                overlay.classList.remove('active');
            });

            document.querySelector('.at-sidebar-close')?.addEventListener('click', (e) => {
                sidebar?.classList.remove('open');
                overlay?.classList.remove('active');
            })
        </script>

        {% block script_block %}{% endblock %}

        
    </body>
</html>
